name: Statik kontroller

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v6

      - name: ShellCheck kur
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install --disable-pip-version-check ruff==0.12.4 PyQt6==6.9.1

      - name: Servis hedeflerini test ortamına yerleştir
        run: |
          sudo install -Dm755 deepfreeze/initcpio/cachy-freeze-reset \
            /usr/lib/cachy-freeze/cachy-freeze-reset
          sudo install -Dm755 deepfreeze/bin/cachy-freeze \
            /usr/local/sbin/cachy-freeze
          sudo install -Dm755 user/files/cachy-employee-reset \
            /usr/local/sbin/cachy-employee-reset
          sudo install -Dm755 user/files/cachy-frozen-admin-restrict \
            /usr/local/sbin/cachy-frozen-admin-restrict

      - name: Statik testleri çalıştır
        env:
          SHELLCHECK_OPTS: --severity=error
        run: bash ./deepfreeze/tests/static.sh

      - name: Python kalite ve birim testleri
        env:
          PYTHONPATH: src:app
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src app/cachy_freeze_gui tests
          ruff format --check src app/cachy_freeze_gui tests
          python -m unittest discover -s tests -v
          bash ./deepfreeze/tests/ui-smoke.sh
