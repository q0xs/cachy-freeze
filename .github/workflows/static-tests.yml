name: Statik kontroller

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workstation-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v6

      - name: Workstation test bağımlılıklarını kur
        run: |
          pacman -Syu --noconfirm --needed \
            cmake desktop-file-utils extra-cmake-modules git kidletime \
            python qt6-base qt6-wayland ruff shellcheck systemd
          # The minimal container has no systemd runtime tree. Its absence makes
          # systemd-analyze try (and fail) to create /run/systemd as the
          # unprivileged build user during unit verification.
          install -d -m 0755 /run/systemd/system
          useradd --create-home workstation-test
          chown -R workstation-test:workstation-test "$GITHUB_WORKSPACE"

      - name: Taşınabilir provisioner testlerini çalıştır
        run: |
          runuser -u workstation-test -- bash workstation/tests/static.sh

      - name: Tek dosyalık artefact tekrarlanabilirliğini doğrula
        run: |
          runuser -u workstation-test -- \
            env SOURCE_DATE_EPOCH=0 bash packaging/build-workstation-installer.sh
          first_hash=$(sha256sum dist/CachyWorkstation-Setup-*.run | cut -d' ' -f1)
          runuser -u workstation-test -- \
            env SOURCE_DATE_EPOCH=0 bash packaging/build-workstation-installer.sh
          second_hash=$(sha256sum dist/CachyWorkstation-Setup-*.run | cut -d' ' -f1)
          test "$first_hash" = "$second_hash"
          cd dist
          sha256sum --check CachyWorkstation-Setup-*.run.sha256

  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v6

      - name: ShellCheck kur
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs desktop-file-utils grub-common libegl1 shellcheck
          python -m pip install --disable-pip-version-check ruff==0.12.4 PyQt6==6.9.1

      - name: Çekirdek hedeflerini test ortamına yerleştir
        run: |
          sudo install -Dm755 deepfreeze/initcpio/cachy-freeze-reset \
            /usr/lib/cachy-freeze/cachy-freeze-reset
          sudo install -Dm755 deepfreeze/bin/cachy-freeze \
            /usr/local/sbin/cachy-freeze

      - name: Statik testleri çalıştır
        env:
          SHELLCHECK_OPTS: --severity=error
        run: bash ./deepfreeze/tests/static.sh

      - name: Python kalite ve birim testleri
        env:
          PYTHONPATH: src:app
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src app/cachy_freeze_gui tests
          ruff format --check src app/cachy_freeze_gui tests
          python -m unittest discover -s tests -v
          bash ./deepfreeze/tests/ui-smoke.sh

      - name: İzole GRUB üretim testi
        run: bash ./deepfreeze/tests/grub-generation.sh

      - name: Tek kullanımlık Btrfs yaşam döngüsü testleri
        run: |
          sudo bash ./deepfreeze/tests/integration-engine.sh
          sudo bash ./deepfreeze/tests/integration-btrfs.sh

  grub-uefi-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v6

      - name: QEMU ve UEFI GRUB araçlarını kur
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect grub-common grub-efi-amd64-bin ovmf qemu-system-x86

      - name: FROZEN ve korumalı THAWED UEFI kabul testi
        run: bash ./deepfreeze/tests/boot-acceptance-vm.sh
