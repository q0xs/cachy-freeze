---
- name: Report CachyFreeze fleet status
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read CachyFreeze status
      ansible.builtin.include_role:
        name: cachy_freeze
        tasks_from: get_status.yml

    - name: Print fleet status row
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}
          | {{ ansible_host | default(inventory_hostname) }}
          | {{ cachy_freeze_status.running_mode | upper }}
          | reboot_required={{ cachy_freeze_status.reboot_required }}
          | employee={{ employee_user | default('UNSET') }}
