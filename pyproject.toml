[project]
name = "cachyfreeze"
version = "1.0.0rc3"
description = "Minimal Btrfs-based FROZEN and THAWED utility for CachyOS"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Atilla Mert Akkaya" }]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"
